<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'de' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2eadb">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: page.subtitle | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Zum Inhalt</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">Bespoke Recipes</a>
        <nav aria-label="Hauptnavigation">
          <a href="{{ '/' | relative_url }}">Rezepte</a>
          <a href="{{ '/favourites/' | relative_url }}">Favoriten</a>
          <a href="{{ '/about/' | relative_url }}">Über</a>
        </nav>
      </div>
    </header>
    <main id="content" class="wrap">{{ content }}</main>
    <footer class="site-footer wrap">
      <p>Ein Rezeptbuch in Markdown. Gemacht zum Kochen, nicht zum Scrollen.</p>
    </footer>
    <script src="{{ '/assets/search.js' | relative_url }}" defer></script>
  </body>
</html>
