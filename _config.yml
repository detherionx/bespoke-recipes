title: Bespoke Recipes
description: Ein persönliches, wachsendes Rezeptbuch für Imbissklassiker, Familienküche und Reisegerichte.
lang: de-DE
url: "https://detherionx.github.io"
baseurl: "/bespoke-recipes"
markdown: kramdown
permalink: pretty
collections:
  recipes:
    output: true
    permalink: /recipes/:name/
defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
