title: Bespoke Recipes
description: Ein persönliches Rezeptbuch mit praktischer Lebensmittelkunde für Einkauf, Lagerung und Küche.
lang: de-DE
url: "https://detherionx.github.io"
baseurl: "/bespoke-recipes"
markdown: kramdown
permalink: pretty
collections:
  recipes:
    output: true
    permalink: /recipes/:name/
  lebensmittel:
    output: true
    permalink: /lebensmittelkunde/:name/
defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe
  - scope:
      path: ""
      type: lebensmittel
    values:
      layout: food
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
